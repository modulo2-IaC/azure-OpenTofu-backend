name: OpenTofu CI/CD - DevSecOps Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  security-and-quality:
    name: DevSecOps Quality & Security Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # HERRAMIENTA 5 (Punto 6 IaC.md): Escaneo de Secretos con Gitleaks
      # -----------------------------------------------------------------------
      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # HERRAMIENTA 3 (Punto 5 IaC.md): Analisis Estatico con TFLint
      # -----------------------------------------------------------------------
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init and Run TFLint
        run: |
          tflint --init
          tflint --config=.tflint.hcl

      # -----------------------------------------------------------------------
      # HERRAMIENTA 4 (Punto 5 IaC.md): Analisis Estatico con Checkov
      # -----------------------------------------------------------------------
      - name: Checkov IaC Security Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true
          output_format: cli

      # -----------------------------------------------------------------------
      # HERRAMIENTA 2 (Punto 3 IaC.md): Setup y Validacion de Dependencias
      # -----------------------------------------------------------------------
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.2

      - name: Check OpenTofu Formatting
        run: tofu fmt -check

      - name: OpenTofu Init (Valida checksums en .terraform.lock.hcl y Backend Remoto)
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: tofu init

      - name: OpenTofu Validate
        run: tofu validate

      # -----------------------------------------------------------------------
      # HERRAMIENTA 6 (Punto 11 IaC.md): Plan con Recursos de Azure Monitor
      # -----------------------------------------------------------------------
      - name: OpenTofu Plan
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}
          TF_VAR_database_url: ${{ secrets.TF_VAR_DATABASE_URL }}
        run: tofu plan -no-color
